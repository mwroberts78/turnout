services:
  postgres:
    image: postgres:17
    container_name: turnout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: turnout
      POSTGRES_PASSWORD: turnout_local_dev
      POSTGRES_DB: turnout_dev
    ports:
      - "5433:5432"
    volumes:
      - turnout_pg_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

volumes:
  turnout_pg_data: